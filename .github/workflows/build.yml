name: Build RedX Linux APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (with embedded PRoot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.2.12479018" 2>/dev/null || true
          echo "NDK=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Cache Gradle + NDK build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /tmp/proot_src
          key: ${{ runner.os }}-gradle-proot-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-proot-

      - name: Build PRoot static binaries (NDK)
        run: |
          chmod +x scripts/build_proot.sh
          scripts/build_proot.sh
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Verify PRoot binaries were built
        run: |
          echo "Assets directory contents:"
          ls -lh app/src/main/assets/ 2>/dev/null || echo "No assets yet"
          test -f app/src/main/assets/proot-arm64-v8a && echo "✓ arm64-v8a OK" || echo "✗ arm64-v8a MISSING"
          test -f app/src/main/assets/proot-armeabi-v7a && echo "✓ armeabi-v7a OK" || echo "✗ armeabi-v7a MISSING"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: APK sizes
        run: |
          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          DEBUG=$(du -sh app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | cut -f1)
          RELEASE=$(du -sh app/build/outputs/apk/release/app-release-unsigned.apk 2>/dev/null | cut -f1)
          echo "- Debug APK: $DEBUG" >> $GITHUB_STEP_SUMMARY
          echo "- Release APK: $RELEASE" >> $GITHUB_STEP_SUMMARY
          echo "- Download from Artifacts section below" >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RedXLinux-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: RedXLinux-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
